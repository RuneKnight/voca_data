name: Daily AI Vocabulary & Sentence Generation

on:
  schedule:
    # Runs daily at 08:00 KST (23:00 UTC previous day)
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: '생성 대상 프로필 (all = 전체 가족 프로필, 또는 me / wife / kid)'
        type: choice
        required: false
        default: 'all'
        options:
          - all
          - me
          - wife
          - kid
      topics:
        description: '(선택) 주제 덮어쓰기 — 비워두면 data/profiles.json의 프로필별 주제 사용'
        required: false
        default: ''
      pair_count:
        description: '(선택) 문장/세트 개수 덮어쓰기 — 비워두면 프로필별 기본 볼륨 사용'
        required: false
        default: ''
      model:
        description: '(선택) Gemini 모델명 덮어쓰기 — 비워두면 프로필별 기본 모델 사용'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (true면 검증만 수행하고 커밋하지 않음)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify GEMINI_API_KEY secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY 시크릿이 설정되지 않았습니다. Settings > Secrets and variables > Actions에서 등록해주세요."
            exit 1
          fi

      - name: Generate daily vocabulary & sentences via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_PROFILE: ${{ github.event.inputs.profile || 'all' }}
          GEMINI_MODEL: ${{ github.event.inputs.model || '' }}
          PAIR_COUNT: ${{ github.event.inputs.pair_count || '' }}
          DAILY_TOPICS: ${{ github.event.inputs.topics || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/generate-daily.mjs

      - name: Validate all profile datasets & integrity
        run: node scripts/validate-data.mjs

      - name: Commit and push updated data
        if: ${{ (github.event.inputs.dry_run || 'false') != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/ && [ -z "$(git ls-files --others --exclude-standard data/)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          DATE_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          PROFILE_LABEL="${{ github.event.inputs.profile || 'all' }}"
          git add data/
          git commit -m "chore(data): add daily Gemini learning data [${PROFILE_LABEL}] (${DATE_KST})"
          git push
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "- **커밋 반영**: \`${COMMIT_SHA}\` (\`chore(data): add daily Gemini learning data [${PROFILE_LABEL}] (${DATE_KST})\`)" >> "$GITHUB_STEP_SUMMARY"
