<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Hub Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    .perspective { perspective: 1000px; }
    .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- 상단 네비게이션 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⚡</span>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 leading-tight">Language Hub Pro</h1>
          <div id="stats" class="text-[11px] text-slate-400 font-medium">데이터 동기화 중...</div>
        </div>
      </div>
      
      <!-- 뷰 모드 전환 (단어 vs 문장) -->
      <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
        <button onclick="switchView('vocab')" id="tab-vocab" class="px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-slate-900 transition">단어 카드</button>
        <button onclick="switchView('sentence')" id="tab-sentence" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 transition">학습 문장</button>
      </div>
    </div>

    <!-- 필터 및 컨트롤 바 -->
    <div class="max-w-5xl mx-auto px-4 pb-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center space-x-1.5 overflow-x-auto py-1">
        <button onclick="setLangFilter('All')" id="btn-All" class="lang-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-900 text-white transition">전체</button>
        <button onclick="setLangFilter('English')" id="btn-English" class="lang-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🇬🇧 English</button>
        <button onclick="setLangFilter('German')" id="btn-German" class="lang-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🇩🇪 Deutsch</button>
        <button onclick="toggleNewOnly()" id="btn-NewOnly" class="px-2.5 py-1 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition">✨ New만 보기</button>
      </div>

      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="단어, 문장, 뜻 검색..." class="w-full sm:w-48 px-3 py-1 text-xs bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400" />
        <button id="btnFlipAll" onclick="toggleAllFlip()" class="whitespace-nowrap px-2.5 py-1 text-xs font-medium border border-slate-200 bg-white rounded-lg hover:bg-slate-50 text-slate-700 transition">전체 뒤집기</button>
      </div>
    </div>
  </header>

  <!-- 메인 학습 영역 -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- 1. 단어 카드 영역 -->
    <div id="vocabSection">
      <div id="vocabGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- 2. 문장 리스트 영역 -->
    <div id="sentenceSection" class="hidden">
      <div id="sentenceList" class="space-y-3.5"></div>
    </div>

    <div id="emptyMessage" class="hidden py-20 text-center text-slate-400 text-sm">
      조건에 일치하는 학습 항목이 없습니다.
    </div>
  </main>

  <script>
    // ==========================================
    // ⚙️ 사용 중인 구글 시트 웹 게시 CSV URL 입력
    // ==========================================
    const VOCAB_CSV_URL = '단어_시트_웹게시_CSV_URL';
    const SENTENCE_CSV_URL = '문장_시트_웹게시_CSV_URL';

    let currentView = 'vocab';
    let currentLang = 'All';
    let currentSearch = '';
    let isNewOnly = false;
    let isAllFlipped = false;

    let vocabData = [];
    let sentenceData = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadData(VOCAB_CSV_URL, (data) => {
        vocabData = data;
        render();
      });
      loadData(SENTENCE_CSV_URL, (data) => {
        sentenceData = data;
      });
    });

    function loadData(url, callback) {
      if (!url || url.includes('_URL')) return;
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => callback(results.data.filter(r => Object.values(r).some(v => v)))
      });
    }

    // TTS 음성 재생 (Web Speech API)
    function speakText(text, lang, event) {
      if (event) event.stopPropagation();
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'German' ? 'de-DE' : 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }

    // 독일어 관사별 스타일 파싱 (der: 파랑, die: 장미/빨강, das: 녹색)
    function getGermanGenderStyle(word) {
      const trimmed = (word || '').trim().toLowerCase();
      if (trimmed.startsWith('der ')) {
        return { border: 'border-blue-300', badge: 'bg-blue-100 text-blue-800 border-blue-200', text: 'der (남성)' };
      } else if (trimmed.startsWith('die ')) {
        return { border: 'border-rose-300', badge: 'bg-rose-100 text-rose-800 border-rose-200', text: 'die (여성)' };
      } else if (trimmed.startsWith('das ')) {
        return { border: 'border-emerald-300', badge: 'bg-emerald-100 text-emerald-800 border-emerald-200', text: 'das (중성)' };
      }
      return { border: 'border-amber-200', badge: 'bg-amber-100 text-amber-800 border-amber-200', text: '독일어' };
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-vocab').className = view === 'vocab' 
        ? 'px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-slate-900 transition' 
        : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 transition';
      document.getElementById('tab-sentence').className = view === 'sentence' 
        ? 'px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-slate-900 transition' 
        : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 transition';

      document.getElementById('vocabSection').classList.toggle('hidden', view !== 'vocab');
      document.getElementById('sentenceSection').classList.toggle('hidden', view !== 'sentence');
      document.getElementById('btnFlipAll').classList.toggle('hidden', view !== 'vocab');
      render();
    }

    function setLangFilter(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.className = 'lang-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
      });
      document.getElementById(`btn-${lang}`).className = 'lang-btn px-3 py-1 rounded-full text-xs font-semibold bg-slate-900 text-white transition';
      render();
    }

    function toggleNewOnly() {
      isNewOnly = !isNewOnly;
      const btn = document.getElementById('btn-NewOnly');
      if (isNewOnly) {
        btn.className = 'px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-600 text-white transition';
      } else {
        btn.className = 'px-2.5 py-1 rounded-full text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition';
      }
      render();
    }

    function handleSearch() {
      currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }

    function toggleAllFlip() {
      isAllFlipped = !isAllFlipped;
      document.querySelectorAll('.card-inner').forEach(card => {
        if (isAllFlipped) card.classList.add('flipped');
        else card.classList.remove('flipped');
      });
    }

    function render() {
      if (currentView === 'vocab') renderVocab();
      else renderSentences();
    }

    // 1. 단어 렌더링
    function renderVocab() {
      const grid = document.getElementById('vocabGrid');
      grid.innerHTML = '';

      const filtered = vocabData.filter(d => {
        const langMatch = currentLang === 'All' || d.Language === currentLang;
        const newMatch = !isNewOnly || (d['Review Status'] || '').toLowerCase() === 'new';
        const word = (d['Word/Phrase'] || '').toLowerCase();
        const meaning = (d.Meaning || '').toLowerCase();
        const colloc = (d['Collocation / Example'] || '').toLowerCase();
        const searchMatch = !currentSearch || word.includes(currentSearch) || meaning.includes(currentSearch) || colloc.includes(currentSearch);
        return langMatch && newMatch && searchMatch;
      });

      updateStats(filtered.length, '단어');
      toggleEmpty(filtered.length === 0);

      filtered.forEach(item => {
        const isGerman = item.Language === 'German';
        const wordText = item['Word/Phrase'] || '';
        const genderStyle = isGerman ? getGermanGenderStyle(wordText) : null;
        const borderClass = isGerman ? genderStyle.border : 'border-slate-200';

        const card = document.createElement('div');
        card.className = 'perspective h-48 cursor-pointer select-none';
        card.onclick = () => card.querySelector('.card-inner').classList.toggle('flipped');

        card.innerHTML = `
          <div class="card-inner ${isAllFlipped ? 'flipped' : ''}">
            <!-- 앞면 -->
            <div class="card-front bg-white border ${borderClass} hover:border-slate-400 rounded-xl p-4 shadow-sm">
              <div class="flex justify-between items-center text-xs">
                ${isGerman ? `
                  <span class="px-2 py-0.5 rounded-md border text-[11px] font-semibold ${genderStyle.badge}">
                    🇩🇪 ${genderStyle.text}
                  </span>
                ` : `
                  <span class="px-2 py-0.5 rounded-md border border-blue-200 bg-blue-50 text-blue-700 text-[11px] font-semibold">
                    🇬🇧 ${item.Level || 'A2'}
                  </span>
                `}
                <div class="flex items-center space-x-1">
                  ${item['Review Status'] === 'New' ? '<span class="text-[10px] bg-indigo-50 text-indigo-600 border border-indigo-200 px-1.5 py-0.2 rounded font-bold">NEW</span>' : ''}
                  <button title="발음 듣기" onclick="speakText('${wordText.replace(/'/g, "\\'")}', '${item.Language}', event)" class="p-1 rounded-full text-slate-400 hover:text-indigo-600 hover:bg-slate-100 transition">
                    🔊
                  </button>
                </div>
              </div>

              <div class="my-auto py-2">
                <div class="font-bold text-lg text-slate-900 tracking-tight">${wordText}</div>
                <div class="text-[11px] text-slate-400 mt-0.5">${item['Part of Speech / Gender'] || ''}</div>
              </div>

              <div class="text-[11px] text-slate-400">클릭하여 뜻 확인 👆</div>
            </div>

            <!-- 뒷면 -->
            <div class="card-back bg-slate-900 border border-slate-900 rounded-xl p-4 text-white shadow-sm">
              <div class="flex justify-between items-center text-xs text-slate-400">
                <span>한국어 의미</span>
                <span class="text-[10px] font-mono text-slate-500">${item.Date || ''}</span>
              </div>

              <div class="my-auto py-2">
                <div class="text-base font-bold text-amber-300">${item.Meaning || ''}</div>
                ${item['Collocation / Example'] ? `
                  <div class="mt-2 text-xs text-slate-200 bg-slate-800/90 border border-slate-700 px-2.5 py-1.5 rounded-lg text-left inline-block">
                    💡 ${item['Collocation / Example']}
                  </div>
                ` : ''}
              </div>

              <div class="text-[11px] text-slate-500">클릭하여 단어로 복귀</div>
            </div>
          </div>`;
        grid.appendChild(card);
      });
    }

    // 2. 문장 렌더링
    function renderSentences() {
      const list = document.getElementById('sentenceList');
      list.innerHTML = '';

      const filtered = sentenceData.filter(d => {
        const langMatch = currentLang === 'All' || d.Language === currentLang;
        const text = (d.Sentence || '').toLowerCase();
        const trans = (d.Translation || '').toLowerCase();
        const points = (d['Key Points'] || '').toLowerCase();
        const searchMatch = !currentSearch || text.includes(currentSearch) || trans.includes(currentSearch) || points.includes(currentSearch);
        return langMatch && searchMatch;
      });

      updateStats(filtered.length, '문장');
      toggleEmpty(filtered.length === 0);

      filtered.forEach((item, idx) => {
        const isGerman = item.Language === 'German';
        const sentenceText = item.Sentence || '';
        const el = document.createElement('div');
        el.className = 'bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:border-slate-300 transition';
        el.innerHTML = `
          <div class="flex justify-between items-center text-xs mb-2">
            <span class="px-2 py-0.5 rounded-md ${isGerman ? 'bg-amber-50 text-amber-800 border border-amber-200' : 'bg-blue-50 text-blue-800 border border-blue-200'} font-semibold">
              ${isGerman ? '🇩🇪 Deutsch' : '🇬🇧 English'} · ${item.Level || ''}
            </span>
            <div class="flex items-center space-x-2">
              <span class="text-slate-400 text-xs font-mono">${item.Date || ''}</span>
              <button title="문장 듣기" onclick="speakText('${sentenceText.replace(/'/g, "\\'")}', '${item.Language}', event)" class="p-1 rounded-full text-slate-400 hover:text-indigo-600 hover:bg-slate-100 transition">
                🔊
              </button>
            </div>
          </div>

          <p class="text-base font-bold text-slate-900 leading-relaxed mb-3">"${sentenceText}"</p>

          <!-- 3초 인출 아코디언 토글 -->
          <details class="group border-t border-slate-100 pt-2">
            <summary class="text-xs text-indigo-600 font-medium cursor-pointer select-none group-open:text-slate-400 hover:underline">
              👉 한국어 해석 및 Key Point 보기
            </summary>
            <div class="mt-2.5 space-y-1.5">
              <p class="text-sm font-medium text-slate-700">${item.Translation || ''}</p>
              ${item['Key Points'] ? `
                <div class="text-xs bg-slate-50 border border-slate-200/60 p-2.5 rounded-lg text-slate-600">
                  <span class="font-bold text-slate-800">📌 Key Point:</span> ${item['Key Points']}
                </div>
              ` : ''}
            </div>
          </details>
        `;
        list.appendChild(el);
      });
    }

    function toggleEmpty(isEmpty) {
      document.getElementById('emptyMessage').classList.toggle('hidden', !isEmpty);
    }

    function updateStats(count, type) {
      document.getElementById('stats').innerText = `총 ${count}개 ${type} 표시 중`;
    }
  </script>
</body>
</html>
