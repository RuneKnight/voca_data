<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Digest & Flashcards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    .perspective { perspective: 1000px; }
    .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.5s; transform-style: preserve-3d; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: space-between; }
    .card-back { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 헤더 & 뷰 전환 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⚡</span>
        <h1 class="text-lg font-bold tracking-tight text-slate-900">Language Hub</h1>
      </div>
      <!-- 대메뉴 전환 (단어 vs 문장) -->
      <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
        <button onclick="switchView('vocab')" id="tab-vocab" class="px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-slate-900 transition">단어 카드</button>
        <button onclick="switchView('sentence')" id="tab-sentence" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 transition">학습 문장</button>
      </div>
    </div>

    <!-- 서브 컨트롤러 (필터/검색) -->
    <div class="max-w-5xl mx-auto px-4 pb-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center space-x-1.5 overflow-x-auto py-1">
        <button onclick="setLangFilter('All')" id="btn-All" class="lang-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition">전체</button>
        <button onclick="setLangFilter('English')" id="btn-English" class="lang-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🇬🇧 English</button>
        <button onclick="setLangFilter('German')" id="btn-German" class="lang-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">🇩🇪 Deutsch</button>
      </div>
      <div class="flex items-center space-x-2">
        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="검색..." class="px-3 py-1.5 text-xs bg-slate-100 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>
    </div>
  </header>

  <!-- 메인 뷰 -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">
    <!-- 단어 그리드 뷰 -->
    <div id="vocabSection">
      <div id="vocabGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </div>

    <!-- 문장 리스트 뷰 -->
    <div id="sentenceSection" class="hidden">
      <div id="sentenceList" class="space-y-4"></div>
    </div>

    <div id="emptyMessage" class="hidden py-16 text-center text-slate-400 text-sm">항목이 없습니다.</div>
  </main>

  <script>
    // ==========================================
    // ⚙️ 2개의 구글 시트 CSV URL 설정
    // ==========================================
    const VOCAB_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROZVuSBM5EBQQdyFKHBHbpsz3r6uoHAcgnkq_8hFzNQHnvO5kvIkAcy83lXf-qYmfHLVPtSSIY-lJx/pub?gid=0&single=true&output=csv';
    const SENTENCE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROZVuSBM5EBQQdyFKHBHbpsz3r6uoHAcgnkq_8hFzNQHnvO5kvIkAcy83lXf-qYmfHLVPtSSIY-lJx/pub?gid=765046051&single=true&output=csv';

    let currentView = 'vocab'; // 'vocab' | 'sentence'
    let currentLang = 'All';
    let currentSearch = '';
    let vocabData = [];
    let sentenceData = [];

    // ==========================================
    // 🔊 Web Speech API (TTS) 설정 & 함수
    // ==========================================
    let availableVoices = [];
    function loadVoices() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text, lang) {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
        return;
      }
      if (!text || !text.trim()) return;

      window.speechSynthesis.cancel(); // 진행 중인 음성 즉시 취소

      const utterance = new SpeechSynthesisUtterance(text.trim());
      const isGerman = (lang || '').toLowerCase() === 'german' || lang === 'Deutsch';
      
      utterance.lang = isGerman ? 'de-DE' : 'en-US';
      utterance.rate = 0.9; // 학습하기 알맞은 또박또박한 속도
      utterance.pitch = 1.0;

      if (!availableVoices || availableVoices.length === 0) {
        availableVoices = window.speechSynthesis.getVoices();
      }

      const langCode = isGerman ? 'de' : 'en';
      // 자연스러운 음성(Google/Apple/Microsoft 등) 우선 매칭
      const matchedVoice = availableVoices.find(v => v.lang && v.lang.toLowerCase().startsWith(langCode));
      if (matchedVoice) {
        utterance.voice = matchedVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    const SPEAKER_ICON_SVG = `
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500 group-hover:text-blue-600 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
      </svg>
    `;

    document.addEventListener('DOMContentLoaded', () => {
      loadData(VOCAB_CSV_URL, (data) => { vocabData = data; render(); });
      loadData(SENTENCE_CSV_URL, (data) => { sentenceData = data; });
    });

    function loadData(url, callback) {
      if (!url || url.includes('_URL')) return;
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (results) => callback(results.data.filter(r => Object.values(r).some(v => v)))
      });
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-vocab').className = view === 'vocab' 
        ? 'px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-slate-900 transition' 
        : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 transition';
      document.getElementById('tab-sentence').className = view === 'sentence' 
        ? 'px-3 py-1 text-xs font-bold rounded-md bg-white shadow-sm text-slate-900 transition' 
        : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-500 hover:text-slate-900 transition';

      document.getElementById('vocabSection').classList.toggle('hidden', view !== 'vocab');
      document.getElementById('sentenceSection').classList.toggle('hidden', view !== 'sentence');
      render();
    }

    function setLangFilter(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.className = 'lang-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
      });
      document.getElementById(`btn-${lang}`).className = 'lang-btn px-3 py-1.5 rounded-full text-xs font-semibold bg-slate-900 text-white transition';
      render();
    }

    function handleSearch() {
      currentSearch = document.getElementById('searchInput').value.trim().toLowerCase();
      render();
    }

    function render() {
      if (currentView === 'vocab') renderVocab();
      else renderSentences();
    }

    // 단어 렌더링
    function renderVocab() {
      const grid = document.getElementById('vocabGrid');
      grid.innerHTML = '';
      const filtered = vocabData.filter(d => {
        const langMatch = currentLang === 'All' || d.Language === currentLang;
        const textMatch = !currentSearch || (d['Word/Phrase'] || '').toLowerCase().includes(currentSearch) || (d.Meaning || '').toLowerCase().includes(currentSearch);
        return langMatch && textMatch;
      });

      toggleEmpty(filtered.length === 0);
      filtered.forEach(item => {
        const isGerman = item.Language === 'German';
        const card = document.createElement('div');
        card.className = 'perspective h-44 cursor-pointer select-none';
        card.onclick = () => card.querySelector('.card-inner').classList.toggle('flipped');
        
        const wordText = item['Word/Phrase'] || '';
        const meaningText = item.Meaning || '';
        const exampleText = item['Collocation / Example'] || '';
        const levelText = item.Level || '';
        const posText = item['Part of Speech / Gender'] || '';

        card.innerHTML = `
          <div class="card-inner">
            <!-- 앞면: 단어 및 발음 듣기 -->
            <div class="card-front bg-white border border-slate-200 rounded-xl p-4 shadow-sm hover:border-slate-300 transition">
              <div class="flex justify-between items-center text-xs">
                <span class="px-2 py-0.5 rounded-full ${isGerman ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'} font-medium">
                  ${isGerman ? '🇩🇪' : '🇬🇧'} ${escapeHtml(levelText)}
                </span>
                <span class="text-slate-400 text-[11px]">${escapeHtml(posText)}</span>
              </div>
              <div class="my-auto flex items-center justify-center gap-2">
                <span class="font-bold text-base text-slate-900">${escapeHtml(wordText)}</span>
                <button type="button" title="발음 듣기" class="btn-tts-word group p-1.5 rounded-full hover:bg-slate-100 active:scale-95 transition">
                  ${SPEAKER_ICON_SVG}
                </button>
              </div>
              <div class="text-[11px] text-slate-400">터치하여 뜻 확인 👆</div>
            </div>

            <!-- 뒷면: 뜻 및 예문 -->
            <div class="card-back bg-slate-900 border border-slate-900 rounded-xl p-4 text-white shadow-sm">
              <div class="text-xs text-slate-400">의미 및 표현</div>
              <div class="my-auto">
                <div class="text-sm font-bold text-amber-300">${escapeHtml(meaningText)}</div>
                ${exampleText ? `
                  <div class="mt-2 text-[11px] text-slate-300 bg-slate-800 px-2.5 py-1.5 rounded flex items-center justify-between gap-1.5 text-left">
                    <span>💡 ${escapeHtml(exampleText)}</span>
                    <button type="button" title="예문 발음 듣기" class="btn-tts-example p-1 rounded hover:bg-slate-700 text-slate-400 hover:text-white transition flex-shrink-0">
                      ${SPEAKER_ICON_SVG}
                    </button>
                  </div>` : ''}
              </div>
              <div class="text-[11px] text-slate-500">터치하여 단어로 복귀</div>
            </div>
          </div>`;

        // 단어 발음 버튼 이벤트 바인딩 (이벤트 버블링 차단: 카드가 뒤집히지 않고 소리만 재생)
        const ttsWordBtn = card.querySelector('.btn-tts-word');
        if (ttsWordBtn) {
          ttsWordBtn.onclick = (e) => {
            e.stopPropagation();
            speakText(wordText, item.Language);
          };
        }

        // 예문 발음 버튼 이벤트 바인딩
        const ttsExampleBtn = card.querySelector('.btn-tts-example');
        if (ttsExampleBtn) {
          ttsExampleBtn.onclick = (e) => {
            e.stopPropagation();
            speakText(exampleText, item.Language);
          };
        }

        grid.appendChild(card);
      });
    }

    // 문장 렌더링
    function renderSentences() {
      const list = document.getElementById('sentenceList');
      list.innerHTML = '';
      const filtered = sentenceData.filter(d => {
        const langMatch = currentLang === 'All' || d.Language === currentLang;
        const textMatch = !currentSearch || (d.Sentence || '').toLowerCase().includes(currentSearch) || (d.Translation || '').toLowerCase().includes(currentSearch);
        return langMatch && textMatch;
      });

      toggleEmpty(filtered.length === 0);
      filtered.forEach(item => {
        const isGerman = item.Language === 'German';
        const el = document.createElement('div');
        el.className = 'bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-2 hover:border-slate-300 transition';
        
        const sentenceText = item.Sentence || '';
        const translationText = item.Translation || '';
        const keyPointsText = item['Key Points'] || '';

        el.innerHTML = `
          <div class="flex justify-between items-center text-xs">
            <span class="px-2 py-0.5 rounded-full ${isGerman ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'} font-semibold">
              ${isGerman ? '🇩🇪 Deutsch' : '🇬🇧 English'} · ${escapeHtml(item.Level || '')}
            </span>
            <span class="text-slate-400 text-xs">${escapeHtml(item.Date || '')}</span>
          </div>
          <div class="flex items-start justify-between gap-3">
            <p class="text-base font-bold text-slate-900 leading-snug">"${escapeHtml(sentenceText)}"</p>
            <button type="button" title="문장 발음 듣기" class="btn-tts-sentence p-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 hover:border-slate-300 text-slate-600 active:scale-95 transition flex-shrink-0">
              ${SPEAKER_ICON_SVG}
            </button>
          </div>
          <p class="text-sm text-slate-600 font-medium">${escapeHtml(translationText)}</p>
          ${keyPointsText ? `
            <div class="mt-2 text-xs bg-slate-50 border border-slate-100 p-2.5 rounded-lg text-slate-700">
              <span class="font-bold text-slate-900">📌 Key Point:</span> ${escapeHtml(keyPointsText)}
            </div>` : ''}
        `;

        // 문장 발음 버튼 이벤트 바인딩
        const ttsSentenceBtn = el.querySelector('.btn-tts-sentence');
        if (ttsSentenceBtn) {
          ttsSentenceBtn.onclick = () => {
            speakText(sentenceText, item.Language);
          };
        }

        list.appendChild(el);
      });
    }

    function toggleEmpty(isEmpty) {
      document.getElementById('emptyMessage').classList.toggle('hidden', !isEmpty);
    }
  </script>
</body>
</html>
